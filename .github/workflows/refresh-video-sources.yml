name: Threads 영상 주소 자동 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: yamae-refresh-video-sources
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 사이트 불러오기
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 영상 주소 갱신
        run: node scripts/refresh-video-sources.mjs
      - name: 변경사항 저장
        shell: bash
        run: |
          if git diff --quiet -- video-sources.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- video-sources.js
          git commit -m "Refresh Threads video sources"
          git push
